; ==============================================================================
; Hack509 PBX - Dialplan Configuration
; ==============================================================================

[general]
static=yes
writeprotect=no

[globals]
; Strictly authorized Twilio Caller ID (+19286688247)
AUTHORIZED_CALLERID = +19286688247
TWILIO_TRUNK = twilio-trunk

[from-internal]
; Internal agent extension calls (1001, 1002...)
exten => _10XX,1,NoOp(Internal call from ${CALLERID(num)} to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30,Tt)
 same => n,Hangup()

; Normalize 10-digit US numbers (NXX-NXX-XXXX -> +1NXXNXXXXXX)
exten => _NXXNXXXXXX,1,NoOp(Normalizing 10-digit US number ${EXTEN} to +1${EXTEN})
 same => n,Goto(from-internal,+1${EXTEN},1)

; Normalize 11-digit US numbers (1NXXNXXXXXX -> +1NXXNXXXXXX)
exten => _1NXXNXXXXXX,1,NoOp(Normalizing 11-digit US number ${EXTEN} to +${EXTEN})
 same => n,Goto(from-internal,+${EXTEN},1)

; Outbound calls to E.164 destinations starting with +
exten => _+[0-9].,1,NoOp(Outbound call initiated by ${CALLERID(num)} to ${EXTEN})
 ; Enforce strictly the authorized Twilio Caller ID - no arbitrary Caller ID permitted
 same => n,Set(CALLERID(num)=${AUTHORIZED_CALLERID})
 same => n,Set(CALLERID(name)=${AUTHORIZED_CALLERID})
 same => n,Set(PJSIP_HEADER(add,P-Asserted-Identity)=<sip:${AUTHORIZED_CALLERID}@hacker509.pstn.twilio.com>)
 same => n,NoOp(Enforced CallerID: ${CALLERID(all)} routing to Twilio Trunk)
 same => n,Dial(PJSIP/${EXTEN}@${TWILIO_TRUNK},60,Tt)
 same => n,NoOp(Dial finished with status: ${DIALSTATUS}, cause: ${HANGUPCAUSE})
 same => n,Hangup()

[internal-agents]
; Compatibility alias for from-internal
include => from-internal

[from-twilio]
; Inbound calls from Twilio trunk to primary agent
exten => _+.,1,NoOp(Inbound call from Twilio to ${EXTEN})
 same => n,Dial(PJSIP/1001,30,Tt)
 same => n,Hangup()
