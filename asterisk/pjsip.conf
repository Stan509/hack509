; ==============================================================================
; Hack509 PBX - PJSIP Configuration
; Production Domain: hacker509.gaboomdriveos.com
; Public IP: 167.71.86.190
; WebRTC Extension: 1001
; Outbound Trunk: Twilio Elastic SIP Trunking (hacker509.pstn.twilio.com)
; ==============================================================================

; --- Transports ---

; UDP Transport for Twilio PSTN Trunking
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=167.71.86.190
external_media_address=167.71.86.190
local_net=172.18.0.0/16

; WebSocket Transport for WebRTC Clients (Proxied via Nginx /sip-ws)
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:5062
external_signaling_address=167.71.86.190
external_media_address=167.71.86.190
local_net=172.18.0.0/16

; --- WebRTC Extension 1001 ---

[1001]
type=endpoint
context=from-internal
disallow=all
allow=opus,ulaw,alaw
auth=1001-auth
aors=1001
direct_media=no
allow_transfer=yes
moh_suggest=default
webrtc=yes
dtls_auto_generate_cert=yes
dtls_verify=fingerprint
dtls_setup=actpass
use_avpf=yes
media_encryption=dtls
ice_support=yes
rtcp_mux=yes
bundle=yes
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
from_domain=hacker509.gaboomdriveos.com

[1001]
type=aor
max_contacts=2
remove_existing=yes

; --- WebRTC Extension 1002 (Secondary Agent) ---

[1002]
type=endpoint
context=from-internal
disallow=all
allow=opus,ulaw,alaw
auth=1002-auth
aors=1002
direct_media=no
allow_transfer=yes
moh_suggest=default
webrtc=yes
dtls_auto_generate_cert=yes
dtls_verify=fingerprint
dtls_setup=actpass
use_avpf=yes
media_encryption=dtls
ice_support=yes
rtcp_mux=yes
bundle=yes
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
from_domain=hacker509.gaboomdriveos.com

[1002]
type=aor
max_contacts=2
remove_existing=yes

; --- Twilio Elastic SIP Trunking (Outbound Termination) ---

[twilio-trunk]
type=endpoint
transport=transport-udp
context=from-twilio
disallow=all
allow=ulaw,alaw,opus
outbound_auth=twilio-trunk-auth
aors=twilio-trunk-aor
from_domain=hacker509.pstn.twilio.com
from_user=hack509trunk
direct_media=no
trust_id_outbound=no
send_pai=yes
send_rpid=yes
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
timers=yes

[twilio-trunk-aor]
type=aor
contact=sip:hacker509.pstn.twilio.com:5060

; --- Include Private Credentials (Stored in root-only /etc/asterisk/pjsip_secrets.conf) ---
#tryinclude /etc/asterisk/pjsip_secrets.conf
