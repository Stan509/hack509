[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[1001]
type=endpoint
context=internal-agents
disallow=all
allow=ulaw,alaw
auth=1001-auth
aors=1001-aor
direct_media=no
allow_transfer=yes
moh_suggest=default
webrtc=yes
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[1001-auth]
type=auth
auth_type=userpass
username=1001
password=LocalAgent-1001!

[1001-aor]
type=aor
max_contacts=1
remove_existing=yes

[1002]
type=endpoint
context=internal-agents
disallow=all
allow=ulaw,alaw
auth=1002-auth
aors=1002-aor
direct_media=no
allow_transfer=yes
moh_suggest=default
webrtc=yes
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

[1002-auth]
type=auth
auth_type=userpass
username=1002
password=LocalAgent-1002!

[1002-aor]
type=aor
max_contacts=1
remove_existing=yes
