version: '3.8'

services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    environment:
      - DEBUG=False
      - SQLITE_DB_PATH=/data/db.sqlite3
    volumes:
      - backend_data:/data

  realtime:
    build: ./realtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - JWT_SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
    expose:
      - "8001"

  asterisk:
    image: andrius/asterisk:22
    restart: unless-stopped
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
    ports:
      # WebRTC audio only. Do not publish SIP UDP/TCP: signalling is proxied
      # through the HTTPS frontend at /sip-ws.
      - "10000-10100:10000-10100/udp"

  browser:
    build: ./browser
    restart: unless-stopped
    expose:
      - "6080"
      - "9222"
    environment:
      - SCREEN_WIDTH=1366
      - SCREEN_HEIGHT=768
    volumes:
      - backend_data:/data
    mem_limit: 1536m
    ipc: host
    security_opt:
      - seccomp:unconfined

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - realtime
      - asterisk
      - browser

volumes:
  backend_data:
