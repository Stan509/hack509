# HTTP: Let's Encrypt challenge & redirect to HTTPS
server {
    listen 80;
    server_name hacker509.gaboomdriveos.com 167.71.86.190 localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Healthcheck endpoint over HTTP for container monitoring
    location = /api/health/ {
        proxy_pass http://backend:8000/api/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: Production Hack509 Stack
server {
    listen 443 ssl;
    server_name hacker509.gaboomdriveos.com;

    ssl_certificate /etc/letsencrypt/live/hacker509.gaboomdriveos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hacker509.gaboomdriveos.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /ws/ {
        proxy_pass http://realtime:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Browser SIP/WebRTC signalling. TLS is terminated by this public proxy;
    # Asterisk itself stays private on the Docker network.
    location = /sip-ws {
        proxy_pass http://asterisk:8088/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Internal auth subrequest for remote browser sessions
    location = /internal/browser-auth {
        internal;
        proxy_pass http://backend:8000/api/browser/auth-check/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Remote Chromium noVNC static assets (CSS, JS modules, icons)
    location /browser/ {
        proxy_pass http://browser:6080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Remote Chromium RFB WebSocket stream - STRICTLY AUTH-GATED
    location /websockify {
        auth_request /internal/browser-auth;
        proxy_pass http://browser:6080/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
